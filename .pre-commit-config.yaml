repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: Mypy strict
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: architecture
        name: Module boundaries and dependency cycles
        entry: uv run --locked lint-imports
        language: system
        pass_filenames: false
        files: (\.pyi?$|^pyproject\.toml$)
