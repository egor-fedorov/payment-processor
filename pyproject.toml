[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-processor"
version = "0.1.0"
description = "Asynchronous payment processing service with FastAPI, PostgreSQL and RabbitMQ"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.115,<1.0",
    "faststream[rabbit]>=0.6.0,<0.7.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.2,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=6,<8"]
dev = [
    {include-group = "test"},
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "pre-commit>=4,<5",
    "import-linter>=2.15,<3",
]

[tool.uv]
required-version = "==0.13.5"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires dedicated PostgreSQL and RabbitMQ test services",
    "containers: restarts the dedicated payment-processor-tests containers",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain, contracts and ports are independent of infrastructure"
type = "forbidden"
source_modules = ["app.domain", "app.contracts", "app.ports"]
forbidden_modules = [
    "app.api", "app.db", "app.messaging", "app.services", "app.core",
    "app.main", "app.consumer", "app.dispatcher",
    "fastapi", "starlette", "faststream", "sqlalchemy", "httpx",
    "asyncpg", "psycopg", "aio_pika",
]

[[tool.importlinter.contracts]]
name = "Persistence is independent of HTTP and AMQP"
type = "forbidden"
source_modules = ["app.db"]
forbidden_modules = [
    "app.api", "app.messaging", "app.services",
    "fastapi", "starlette", "faststream", "httpx", "aio_pika",
]

[[tool.importlinter.contracts]]
name = "Payment use cases depend on effect ports, not transport adapters"
type = "forbidden"
source_modules = ["app.services.payments", "app.services.rejections"]
forbidden_modules = [
    "app.api", "app.messaging", "app.services.gateway", "app.services.webhook",
    "fastapi", "starlette", "faststream", "httpx", "aio_pika",
]

[[tool.importlinter.contracts]]
name = "Outbox dispatching is independent of persistence and broker implementations"
type = "forbidden"
source_modules = ["app.messaging.dispatcher"]
forbidden_modules = ["app.db", "sqlalchemy", "faststream", "aio_pika"]

[[tool.importlinter.contracts]]
name = "Application packages and modules have no dependency cycles"
type = "acyclic_siblings"
ancestors = ["app"]

[tool.coverage.run]
branch = true
source = ["app"]
data_file = "reports/coverage/.coverage"

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "class .*\\bProtocol\\):"]

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"

[tool.coverage.html]
directory = "reports/coverage/html"
