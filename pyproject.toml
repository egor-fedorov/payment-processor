[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-processor"
version = "0.1.0"
description = "Asynchronous payment processing service with FastAPI, PostgreSQL and RabbitMQ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.115,<1.0",
    "faststream[rabbit]>=0.6.0,<0.7.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.2,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
